[project]
name = "campus-flow"
version = "0.1.0"
description = "智校园 CampusFlow —— 基于 LangGraph + MCP 的高校智能事务 Agent 平台"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Agent HTTP 入口（app/api/server.py）：最小 Web 框架 + ASGI 服务器。
    # 只在启动 ``python -m app.api.server`` 时用到，CLI 入口不 import 它们，
    # 因此不增加 CLI 启动开销；但作为「项目用到的就声明」原则，仍写进主依赖。
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "langchain>=1.4,<2.0",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6,<2.0",
    "langchain-openai>=1.6,<2.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2,<2.0",
    # 显式直接依赖：SQLite 检查点后端（app/agent/graph/checkpoint_sqlite.py 直接 import）。
    # langgraph-checkpoint 本体只含 base/memory/serde，**不含 sqlite**，必须单独声明；
    # 默认后端仍是 memory，装它是为了让 CHECKPOINTER_BACKEND=sqlite 能跨进程续上会话。
    "langgraph-checkpoint-sqlite>=3.1.1",
    # 显式直接依赖：Dataset 同步模块（app/rag/evaluation/langsmith_dataset.py）
    # 直接 import 官方 SDK；虽然它随 langchain 间接装上，但「用到就声明」——
    # 让依赖清单说清真实用途，也避免上游哪天不再代装。
    "langsmith>=0.14,<1.0",
    "mcp>=2.2.0",
    "pypdf>=6.19.0",
    "python-dotenv>=1.2,<2.0",
    # FastAPI 的 ASGI 运行服务器。只用标准 ``uvicorn.run()`` 启动方式，
    # 不引入 gunicorn 等生产级方案（本阶段只在开发 / 联调用）。
    "uvicorn>=0.34,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["campus-agent/tests"]
pythonpath = ["campus-agent"]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
